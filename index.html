<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALUMI FORM 2.0 · Prévia PCP</title>
<style>
:root{--bg:#f3f4f6;--panel:#fff;--ink:#20242b;--muted:#747b86;--line:#e5e7eb;--dark:#17191d;--gold:#b89a68;--green:#198754;--amber:#b7791f;--red:#b54747;--blue:#426b91;--shadow:0 8px 24px #1118270b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.sidebar{width:248px;background:var(--dark);color:#f7f7f7;padding:22px 15px;flex-shrink:0}.brand{padding:8px 12px 24px;border-bottom:1px solid #ffffff20;margin-bottom:18px}.brand b{font-size:20px;letter-spacing:2px}.brand small{display:block;color:#b8bdc5;font-size:10px;letter-spacing:1.1px;margin-top:5px}.navlabel{color:#8e949d;text-transform:uppercase;font-size:10px;letter-spacing:1.2px;padding:12px}.nav button{display:flex;width:100%;gap:11px;align-items:center;text-align:left;color:#d7d9dd;background:transparent;border:0;padding:11px 12px;border-radius:9px;margin:2px 0}.nav button:hover,.nav button.active{background:#ffffff14;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--gold)}.nav .ico{width:18px;text-align:center;color:#c3a779}.sidefoot{margin:30px 10px 0;color:#89909a;font-size:11px}.main{min-width:0;flex:1}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:3}.crumb{color:var(--muted);font-size:12px}.topright{display:flex;align-items:center;gap:12px}.avatar{background:#e9e2d6;color:#5b4b34;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700}.content{padding:28px 30px 50px;max-width:1440px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.eyebrow{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:1.3px;text-transform:uppercase}.pagehead h1{margin:4px 0;font-size:25px;letter-spacing:-.5px}.sub{color:var(--muted);margin:0}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 13px;color:var(--ink);font-weight:600}.btn.primary{background:var(--dark);color:#fff;border-color:var(--dark)}.btn.gold{background:#f4eee4;border-color:#e7d9c2;color:#6b5430}.btn.small{padding:6px 9px;font-size:12px}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.stat{padding:17px}.stat .num{font-size:27px;font-weight:750;letter-spacing:-1px}.stat .lbl{color:var(--muted);font-size:12px}.card{padding:19px;margin-bottom:16px}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.cardhead h2,.card h2{font-size:16px;margin:0}.cardhead p{color:var(--muted);margin:3px 0 0;font-size:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:590px}th{text-align:left;color:var(--muted);font-size:11px;font-weight:650;padding:10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid #eff0f2;vertical-align:middle}tr:last-child td{border-bottom:0}.workcode{font-weight:750}.workname{font-size:12px;color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:30px;padding:4px 9px;font-size:11px;font-weight:700;background:#f1f2f4;color:#59616b;white-space:nowrap}.pill.ok{background:#e8f5ed;color:var(--green)}.pill.wait{background:#fff4df;color:#9b6818}.pill.info{background:#eaf1f8;color:var(--blue)}.pill.red{background:#faeaea;color:var(--red)}.two{grid-template-columns:1.25fr .75fr}.progress{height:7px;background:#eceef0;border-radius:20px;overflow:hidden;min-width:90px}.progress span{display:block;height:100%;background:var(--green);border-radius:20px}.muted{color:var(--muted)}.smalltext{font-size:12px}.sectionnav{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 16px}.tab{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:8px;color:#525a65;font-size:12px;font-weight:650}.tab.active{background:var(--dark);color:white;border-color:var(--dark)}.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;color:var(--muted);font-weight:650}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink)}.field textarea{min-height:72px;resize:vertical}.material-list{display:grid;gap:10px}.material{border:1px solid var(--line);border-radius:10px;padding:13px;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px;align-items:center}.material strong{display:block}.material small{color:var(--muted)}.material select,.material input{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px;background:white}.material .datebox{font-size:12px;color:var(--muted)}.timeline{border-left:2px solid #e8e1d6;margin:8px 0 0 7px;padding-left:17px}.timeline div{position:relative;margin:0 0 14px}.timeline div:before{content:'';position:absolute;left:-23px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--gold)}.notice{background:#f7f4ef;border:1px solid #eee4d5;border-radius:9px;padding:12px;color:#66563e;font-size:12px}.hidden{display:none!important}.empty{padding:28px;text-align:center;color:var(--muted)}.modalback{position:fixed;inset:0;background:#11182766;display:grid;place-items:center;padding:15px;z-index:10}.modal{background:#fff;border-radius:14px;padding:22px;width:min(560px,100%);box-shadow:0 20px 60px #0003}.modal h2{margin:0 0 16px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;bottom:22px;right:22px;background:#20242b;color:#fff;padding:11px 15px;border-radius:9px;box-shadow:var(--shadow);z-index:20}.itemtitle{display:flex;align-items:center;gap:8px}.itemtitle .dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}.mobilemenu{display:none}
@media(max-width:900px){.sidebar{width:210px}.content{padding:22px 18px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:650px){.shell{display:block}.sidebar{width:100%;padding:10px 12px}.brand{padding:7px 8px 10px;margin:0;border:0}.brand b{font-size:17px}.brand small{font-size:9px}.navlabel,.sidefoot{display:none}.nav{display:flex;overflow:auto;gap:5px;padding-bottom:4px}.nav button{white-space:nowrap;width:auto;padding:8px 10px;font-size:12px}.nav .ico{display:none}.top{height:52px;padding:0 15px}.content{padding:20px 13px}.pagehead{display:block}.pagehead .btn{margin-top:12px}.stats{gap:9px}.stat{padding:12px}.stat .num{font-size:23px}.fieldgrid{grid-template-columns:1fr}.material{grid-template-columns:1fr 1fr}.material>div:first-child{grid-column:1/-1}.card{padding:14px}}
</style></head>
<body><div class="shell">
<aside class="sidebar"><div class="brand"><b>ALUMI FORM</b><small>GESTÃO DE PROCESSOS · IMPLEMENTAÇÃO DE SISTEMAS</small></div><div class="navlabel">Workspace</div><nav class="nav" id="nav">
<button class="active" data-page="overview"><span class="ico">▦</span>Visão geral</button>
<button data-page="works"><span class="ico">▤</span>Obras</button>
<button data-page="commercial"><span class="ico">◉</span>Comercial</button>
<button data-page="technical"><span class="ico">⌕</span>Área técnica e projetos</button>
<button data-page="purchases"><span class="ico">⇧</span>Compras</button>
<button data-page="stock"><span class="ico">▣</span>Estoque</button>
<button data-page="pcp"><span class="ico">◷</span>PCP e agenda</button>
<button data-page="production"><span class="ico">⚙</span>Produção</button>
<button data-page="installation"><span class="ico">⌂</span>Instalação</button>
<button data-page="closing"><span class="ico">✓</span>Conclusão</button>
</nav><div class="sidefoot">PRÉVIA INTERATIVA · DADOS DE DEMONSTRAÇÃO</div></aside>
<main class="main"><header class="top"><div class="crumb">ALUMI FORM <span class="muted">/</span> <span id="crumb">Visão geral</span></div><div class="topright"><span class="smalltext muted">Ambiente demonstrativo</span><div class="avatar">AF</div></div></header><div class="content" id="app"></div></main></div>
<div id="modalroot"></div><div id="toastroot"></div>
<script>
const seed=[{code:'024',name:'Residência Silva',client:'Marcos Silva',address:'Rua das Palmeiras, 120 — Salto/SP',phone:'(11) 99999-0000',type:'Esquadrias',items:10,mounted:7,installed:7,obs:'Faltam 3 itens no pavimento superior.',technical:{measure:'Concluído',cut:'Concluído',assembly:'Pendente',materials:{Vidros:{release:'Concluído'},Acessórios:{release:'Pendente'},Perfis:{release:'Concluído'}}},purchases:{Vidros:{status:'Concluído',sent:'2026-11-06T10:30',history:['2026-11-06T10:30']},Acessórios:{status:'Pendente',sent:'',history:[]},Perfis:{status:'Concluído',sent:'2026-11-05T15:10',history:['2026-11-05T15:10']}},stock:{Vidros:{received:'Concluído',check:'Concluído'},Acessórios:{received:'Pendente',check:'Pendente'},Perfis:{received:'Concluído',check:'Concluído'}},production:'Em fabricação',schedule:'2026-11-12',days:3,installStatus:'Parcialmente instalado',installers:'Equipe A',feedback:'',os:'OS-024',created:'2026-10-20',stage:'Instalação'}];
let works=JSON.parse(localStorage.getItem('af_works_demo')||'null')||seed;
// Migração compatível: converte a programação antiga (data + dias) em intervalo de produção.
works.forEach(w=>{if(!('mounted' in w))w.mounted=0;if(!('productionStart' in w)){w.productionStart=w.schedule||'';let end=w.schedule||'';if(end){let d=new Date(end+'T12:00:00');d.setDate(d.getDate()+Math.max(0,(Number(w.days)||1)-1));w.productionEnd=d.toISOString().slice(0,10)}else w.productionEnd='';}if(!('productionEnd' in w))w.productionEnd='';if(!('installationStart' in w))w.installationStart='';if(!('installationEnd' in w))w.installationEnd='';});let current='overview',selected='024',activeWorkTab='summary';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem('af_works_demo',JSON.stringify(works));const work=()=>works.find(w=>w.code===selected)||works[0];
function toast(msg){$('#toastroot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toastroot').innerHTML='',2300)}
function pill(s){let c=['Concluído','Recebido','OK','Finalizada'].includes(s)?'ok':['Pendente','Aguardando','Parcialmente instalado','Parcialmente recebido','Parcialmente montada'].includes(s)?'wait':'info';return `<span class="pill ${c}">${esc(s||'Não definido')}</span>`}
function head(kicker,title,sub,button=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${button}</div>`}
function stat(n,l){return `<div class="stat"><div class="num">${n}</div><div class="lbl">${l}</div></div>`}
function workSelect(){return `<select id="workpick" aria-label="Selecionar obra">${works.map(w=>`<option value="${esc(w.code)}" ${w.code===selected?'selected':''}>${esc(w.code)} · ${esc(w.name)}</option>`).join('')}</select>`}
function assemblyStatus(w){return (w.mounted||0)<=0?'Pendente':(w.mounted||0)>=w.items?'Concluída':'Parcialmente montada'}
function rangeLabel(start,end){if(!start&&!end)return 'Não programado';if(start&&(!end||start===end))return fmtDate(start)+' · mesmo dia';if(!start)return 'Início não definido · até '+fmtDate(end);if(!end)return 'A partir de '+fmtDate(start)+' · término não definido';return fmtDate(start)+' a '+fmtDate(end)}
function overview(){let pending=works.reduce((a,w)=>a+Object.values(w.technical.materials).filter(x=>x.release==='Pendente').length+Object.values(w.purchases).filter(x=>x.status==='Pendente').length,0);return `${head('Painel de gestão','Visão geral','Acompanhamento das obras, setores e execução.','<button class="btn primary" onclick="openNewWork()">＋ Cadastrar obra</button>')}<div class="grid stats">${stat(works.length,'Obras cadastradas')}${stat(works.filter(w=>w.production==='Em fabricação').length,'Em fabricação')}${stat(works.filter(w=>w.installed>0&&w.installed<w.items).length,'Com instalação parcial')}${stat(pending,'Controles pendentes · demonstração')}</div><div class="grid two"><section class="card"><div class="cardhead"><div><h2>Obras em acompanhamento</h2><p>Selecione uma obra para consultar os setores.</p></div><button class="btn small" onclick="go('works')">Ver todas</button></div><div class="tablewrap"><table><thead><tr><th>Obra</th><th>Etapa</th><th>Montagem</th><th>Instalação</th><th></th></tr></thead><tbody>${works.map(w=>`<tr><td><div class="workcode">${esc(w.code)}</div><div class="workname">${esc(w.name)}</div></td><td>${pill(w.stage)}</td><td>${w.type==='Esquadrias'?`<div class="smalltext">${w.mounted||0}/${w.items} · ${Math.round((w.mounted||0)/w.items*100)}%</div><div class="progress" style="width:75px"><span style="width:${Math.round((w.mounted||0)/w.items*100)}%"></span></div>`:'—'}</td><td><div style="display:flex;gap:8px;align-items:center"><div class="progress" style="width:75px"><span style="width:${Math.round(w.installed/w.items*100)}%"></span></div><b class="smalltext">${Math.round(w.installed/w.items*100)}%</b></div></td><td><button class="btn small" onclick="openWork('${esc(w.code)}')">Abrir</button></td></tr>`).join('')}</tbody></table></div></section><section class="card"><div class="cardhead"><div><h2>Programações</h2><p>Períodos independentes de produção e instalação.</p></div><button class="btn small" onclick="go('pcp')">Editar agenda</button></div>${works.filter(w=>w.productionStart||w.productionEnd||w.installationStart||w.installationEnd).map(w=>`<div style="padding:11px 0;border-bottom:1px solid var(--line)"><div class="itemtitle"><span class="dot"></span><b>${esc(w.code)} · ${esc(w.name)}</b></div><div class="smalltext muted">Produção: ${rangeLabel(w.productionStart,w.productionEnd)}</div><div class="smalltext muted">Instalação: ${rangeLabel(w.installationStart,w.installationEnd)}</div></div>`).join('')||'<div class="empty">Nenhuma programação cadastrada.</div>'}<div class="notice" style="margin-top:14px">Cada programação tem data inicial e final. Pode terminar no mesmo dia; datas coincidentes entre obras são permitidas.</div></section></div>`}
function fmtDate(v){if(!v)return '—';let d=new Date(v.length===10?v+'T12:00':v);return isNaN(d)?v:d.toLocaleDateString('pt-BR')+(v.includes('T')?' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'')}
function worksPage(){return `${head('Cadastro e acompanhamento','Obras','Código e nome são definidos manualmente e acompanham a obra em todos os setores.','<button class="btn primary" onclick="openNewWork()">＋ Cadastrar obra</button>')}<section class="card"><div class="tablewrap"><table><thead><tr><th>Código / obra</th><th>Cliente</th><th>Tipo</th><th>Endereço</th><th>Instalação</th><th></th></tr></thead><tbody>${works.map(w=>`<tr><td><b>${esc(w.code)}</b><div class="workname">${esc(w.name)}</div></td><td>${esc(w.client)}</td><td>${esc(w.type)}</td><td>${esc(w.address)}</td><td>${w.installed}/${w.items} itens (${Math.round(w.installed/w.items*100)}%)</td><td><button class="btn small" onclick="openWork('${esc(w.code)}')">Abrir obra</button></td></tr>`).join('')}</tbody></table></div></section>`}
function openWork(code){selected=code;activeWorkTab='summary';go('workdetail')}
function workDetail(){let w=work();return `${head('Ficha da obra',`${esc(w.code)} · ${esc(w.name)}`,`${esc(w.client)} · ${esc(w.address)}`,'<button class="btn" onclick="go(\'works\')">← Voltar às obras</button>')}<div class="sectionnav"><button class="tab ${activeWorkTab==='summary'?'active':''}" onclick="workTab('summary')">Resumo</button><button class="tab ${activeWorkTab==='technical'?'active':''}" onclick="workTab('technical')">Área técnica</button><button class="tab ${activeWorkTab==='purchases'?'active':''}" onclick="workTab('purchases')">Compras</button><button class="tab ${activeWorkTab==='stock'?'active':''}" onclick="workTab('stock')">Estoque</button>${w.type==='Esquadrias'?`<button class="tab ${activeWorkTab==='production'?'active':''}" onclick="workTab('production')">Montagem / Produção</button>`:''}<button class="tab ${activeWorkTab==='installation'?'active':''}" onclick="workTab('installation')">Instalação</button></div>${activeWorkTab==='summary'?summaryWork(w):activeWorkTab==='technical'?technicalWork(w):activeWorkTab==='purchases'?purchaseWork(w):activeWorkTab==='stock'?stockWork(w):activeWorkTab==='production'&&w.type==='Esquadrias'?productionWork(w):installationWork(w)}`}
function summaryWork(w){return `<div class="grid stats">${stat(w.type,'Tipo de empresa')}${stat(w.items,'Itens totais')}${stat(w.installed+'/'+w.items,'Itens instalados')}${stat(Math.round(w.installed/w.items*100)+'%','Instalação concluída')}</div><div class="grid two"><section class="card"><h2>Dados da obra</h2><p><b>Cliente:</b> ${esc(w.client)}</p><p><b>Endereço:</b> ${esc(w.address)}</p><p><b>Contato:</b> ${esc(w.phone)}</p><p><b>O.S.:</b> ${esc(w.os||'—')}</p><p><b>Observação:</b> ${esc(w.obs||'—')}</p></section><section class="card"><h2>Progresso da execução</h2>${w.type==='Esquadrias'?`<p><b>Montagem:</b> ${Math.round((w.mounted||0)/w.items*100)}% (${w.mounted||0} de ${w.items}; ${Math.max(0,w.items-(w.mounted||0))} faltantes)</p><div class="progress"><span style="width:${Math.round((w.mounted||0)/w.items*100)}%"></span></div>`:''}<p style="margin-top:14px"><b>Instalação:</b> ${Math.round(w.installed/w.items*100)}% (${w.installed} de ${w.items}; ${Math.max(0,w.items-w.installed)} faltantes)</p><div class="progress"><span style="width:${Math.round(w.installed/w.items*100)}%"></span></div><p><b>Etapa atual:</b> ${esc(w.stage)}</p></section></div><section class="card"><h2>Resumo de materiais</h2>${materialsTable(w)}</section>`}
const mats=['Vidros','Acessórios','Perfis'];
function materialsTable(w){return `<div class="tablewrap"><table><thead><tr><th>Material</th><th>Área técnica · entregue para comprar</th><th>Compras · envio</th><th>Estoque · recebimento</th></tr></thead><tbody>${mats.map(m=>`<tr><td><b>${m}</b></td><td>${pill(w.technical.materials[m].release)}</td><td>${pill(w.purchases[m].status)}<div class="smalltext muted">${fmtDate(w.purchases[m].sent)}</div></td><td>${pill(w.stock[m].received)}</td></tr>`).join('')}</tbody></table></div>`}
function technicalWork(w){return `<section class="card"><div class="cardhead"><div><h2>Área Técnica e Projetos</h2><p>Controles próprios da obra ${esc(w.code)}.</p></div></div><div class="material-list">${[['Medição final','measure'],['Plano de corte','cut'],...(w.type==='Esquadrias'?[['Ficha de montagem','assembly']]:[])].map(([label,key])=>`<div class="material"><div><strong>${label}</strong><small>Controle da etapa</small></div><div><select onchange="setTech('${key}',this.value)"><option ${w.technical[key]==='Pendente'?'selected':''}>Pendente</option><option ${w.technical[key]==='Concluído'?'selected':''}>Concluído</option></select></div><div class="datebox">${pill(w.technical[key])}</div></div>`).join('')}</div></section><section class="card"><div class="cardhead"><div><h2>Romaneio de materiais</h2><p>Marcação individual de entrega para Compras.</p></div></div><div class="material-list">${mats.map(m=>`<div class="material"><div><strong>${m}</strong><small>Entregue para comprar?</small></div><div><select onchange="setRelease('${m}',this.value)"><option ${w.technical.materials[m].release==='Pendente'?'selected':''}>Pendente</option><option ${w.technical.materials[m].release==='Concluído'?'selected':''}>Concluído</option></select></div><div class="datebox">${pill(w.technical.materials[m].release)}</div></div>`).join('')}</div><div class="notice" style="margin-top:14px">A liberação pela Área Técnica não marca automaticamente o envio ao fornecedor. Compras faz esse controle separadamente.</div></section>`}
function purchaseWork(w){return `<section class="card"><div class="cardhead"><div><h2>Compras · ${esc(w.code)} — ${esc(w.name)}</h2><p>Envio aos fornecedores por material, com registro de data e horário.</p></div></div><div class="material-list">${mats.map(m=>{let p=w.purchases[m],released=w.technical.materials[m].release==='Concluído';return `<div class="material"><div><strong>${m}</strong><small>Liberação técnica: ${released?'Liberado':'Ainda não liberado'}</small></div><div><label class="smalltext muted">Envio ao fornecedor</label><select ${!released?'disabled':''} onchange="setPurchase('${m}',this.value)"><option ${p.status==='Pendente'?'selected':''}>Pendente</option><option ${p.status==='Concluído'?'selected':''}>Concluído</option></select></div><div class="datebox"><b>Data do envio</b><br>${p.sent?fmtDate(p.sent):'Ainda não enviado'}<br><button class="btn small" style="margin-top:6px" onclick="resend('${m}')" ${!released?'disabled':''}>Registrar reenvio</button></div></div>`}).join('')}</div><div class="notice" style="margin-top:14px">Ao marcar Concluído, a prévia registra data e hora. Reenvios acrescentam um evento ao histórico, sem apagar o anterior. O envio só pode ser registrado depois da liberação técnica.</div></section><section class="card"><h2>Histórico de envios</h2>${mats.map(m=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${m}</b><div class="timeline">${(w.purchases[m].history||[]).length?(w.purchases[m].history).map(d=>`<div class="smalltext">Envio registrado · ${fmtDate(d)}</div>`).join(''):'<div class="smalltext muted">Nenhum envio registrado.</div>'}</div></div>`).join('')}</section>`}
function stockWork(w){return `<section class="card"><div class="cardhead"><div><h2>Estoque · ${esc(w.code)} — ${esc(w.name)}</h2><p>Recebimento e conferência independentes por material.</p></div></div><div class="material-list">${mats.map(m=>`<div class="material"><div><strong>${m}</strong><small>Compra: ${esc(w.purchases[m].status)}</small></div><div><label class="smalltext muted">Recebimento</label><select onchange="setStock('${m}','received',this.value)"><option ${w.stock[m].received==='Pendente'?'selected':''}>Pendente</option>${m==='Vidros'?`<option ${w.stock[m].received==='Parcialmente recebido'?'selected':''}>Parcialmente recebido</option>`:''}<option ${w.stock[m].received==='Concluído'?'selected':''}>Concluído</option></select></div><div><label class="smalltext muted">Conferência</label><select onchange="setStock('${m}','check',this.value)"><option ${w.stock[m].check==='Pendente'?'selected':''}>Pendente</option><option ${w.stock[m].check==='Concluído'?'selected':''}>Concluído</option></select></div></div>`).join('')}</div><div class="notice" style="margin-top:14px">Receber um material não conclui o recebimento dos demais. A conferência também é independente.</div></section>`}
function productionWork(w){let pct=w.items?Math.round((w.mounted||0)/w.items*100):0;return `<section class="card"><div class="cardhead"><div><h2>Montagem · Produção</h2><p>${esc(w.code)} — ${esc(w.name)} · acompanhamento independente da instalação.</p></div>${pill(assemblyStatus(w))}</div><div class="grid stats" style="margin-top:15px">${stat(w.items,'Itens totais')}${stat(w.mounted||0,'Itens montados')}${stat(Math.max(0,w.items-(w.mounted||0)),'Itens faltantes')}${stat(pct+'%','Montagem concluída')}</div><div class="progress" style="margin:12px 0 18px"><span style="width:${pct}%"></span></div><div class="fieldgrid"><div class="field"><label>Quantidade de itens montados</label><input id="mountedCount" type="number" min="0" max="${w.items}" value="${w.mounted||0}"></div><div class="field" style="grid-column:1/-1"><label>Observação</label><textarea id="productionObs">${esc(w.productionObs||'')}</textarea></div></div><button class="btn primary" style="margin-top:14px" onclick="saveProduction()">Salvar acompanhamento da montagem</button><div class="notice" style="margin-top:14px">A montagem é acompanhada pela quantidade de itens montados. A instalação possui contagem e percentual próprios. Pendências de materiais continuam visíveis separadamente e não escondem esta etapa.</div></section>`}
function installationWork(w){return `<section class="card"><h2>Instalação · ${esc(w.code)} — ${esc(w.name)}</h2><div class="grid stats" style="margin-top:15px">${stat(w.items,'Itens totais')}${stat(w.installed,'Itens instalados')}${stat(w.items-w.installed,'Itens restantes')}${stat(Math.round(w.installed/w.items*100)+'%','Percentual')}</div><div class="fieldgrid"><div class="field"><label>Quantidade de itens instalados</label><input id="installedCount" type="number" min="0" max="${w.items}" value="${w.installed}"></div><div class="field"><label>Instaladores responsáveis</label><input id="installers" value="${esc(w.installers||'')}"></div><div class="field" style="grid-column:1/-1"><label>Observação</label><textarea id="installObs">${esc(w.obs||'')}</textarea></div></div><button class="btn primary" style="margin-top:14px" onclick="saveInstall()">Salvar acompanhamento</button><div class="notice" style="margin-top:14px">A quantidade instalada é independente da montagem. O sistema calcula automaticamente itens faltantes e percentual.</div></section>`}
function genericPage(key){if(key==='production' && works.every(w=>w.type==='Vidraçaria'))return `${head('Setor','Produção','Fabricação de esquadrias não se aplica às vidraçarias.')}<section class="card"><div class="notice">Não há obras de esquadrias cadastradas neste ambiente demonstrativo.</div></section>`;if(key==='production')return `${head('Setor','Produção e montagem','Acompanhe a quantidade montada em cada obra de esquadrias.')}<section class="card"><div class="notice" style="margin-bottom:14px">A produção aparece para todas as obras de esquadrias, independentemente de algum material continuar pendente. As pendências de material permanecem sinalizadas separadamente.</div>${works.filter(w=>w.type==='Esquadrias').map(w=>{let pct=w.items?Math.round((w.mounted||0)/w.items*100):0;return `<div class="material"><div><strong>${esc(w.code)} · ${esc(w.name)}</strong><small>${w.mounted||0} de ${w.items} itens montados · ${w.items-(w.mounted||0)} faltantes</small><div class="progress" style="margin-top:7px"><span style="width:${pct}%"></span></div></div><div><b>${pct}% montado</b><div class="smalltext muted">${esc(assemblyStatus(w))}</div></div><div><button class="btn small" onclick="openWork('${esc(w.code)}');workTab('production')">Atualizar montagem</button></div></div>`}).join('')}</section>`;let map={commercial:['Comercial','Entrada da obra, O.S., comunicação com cliente e pós-venda.','O Comercial recebe as solicitações do cliente e encaminha as informações aos setores responsáveis.'],pcp:['PCP e agenda','Programação e acompanhamento de produção e instalação.','A agenda permite programar duração em dias, alterar datas e manter obras na mesma data, sem bloqueio automático.'],production:['Produção','Acompanhamento da fabricação por obra.','Etapa exclusiva de empresas de esquadrias de alumínio.'],closing:['Conclusão e pós-venda','Relatório final, responsáveis e retorno do cliente.','O Comercial registra o feedback do cliente no pós-venda.']};let [title,sub,desc]=map[key];if(key==='pcp')return `${head('Programação','PCP e agenda',sub)}<section class="card"><div class="cardhead"><div><h2>Programação de produção</h2><p>Informe o primeiro e o último dia de produção de cada obra.</p></div></div>${works.filter(w=>w.type==='Esquadrias').map(w=>`<div class="material"><div><strong>${esc(w.code)} · ${esc(w.name)}</strong><small>Período: ${rangeLabel(w.productionStart,w.productionEnd)}</small></div><div><label class="smalltext muted">Data inicial</label><input type="date" value="${w.productionStart||''}" onchange="setSchedule('${esc(w.code)}','productionStart',this.value)"></div><div><label class="smalltext muted">Data final</label><input type="date" value="${w.productionEnd||''}" onchange="setSchedule('${esc(w.code)}','productionEnd',this.value)"></div></div>`).join('')||'<div class="empty">Não há obras de esquadrias cadastradas.</div>'}</section><section class="card"><div class="cardhead"><div><h2>Programação de instalação</h2><p>Período independente da programação de produção.</p></div></div>${works.map(w=>`<div class="material"><div><strong>${esc(w.code)} · ${esc(w.name)}</strong><small>Período: ${rangeLabel(w.installationStart,w.installationEnd)}</small></div><div><label class="smalltext muted">Data inicial</label><input type="date" value="${w.installationStart||''}" onchange="setSchedule('${esc(w.code)}','installationStart',this.value)"></div><div><label class="smalltext muted">Data final</label><input type="date" value="${w.installationEnd||''}" onchange="setSchedule('${esc(w.code)}','installationEnd',this.value)"></div></div>`).join('')}</section><section class="card"><h2>Acompanhamento da fabricação</h2>${works.filter(w=>w.type==='Esquadrias').map(w=>`<div class="material"><div><strong>${esc(w.code)} · ${esc(w.name)}</strong><small>Fabricação</small></div><div><select onchange="setProduction('${esc(w.code)}',this.value)"><option ${w.production==='Pendente'?'selected':''}>Pendente</option><option ${w.production==='Em fabricação'?'selected':''}>Em fabricação</option><option ${w.production==='Concluído'?'selected':''}>Concluído</option></select></div><div class="datebox">${pill(w.production)}</div></div>`).join('')}</section>`;return `${head('Setor',''+title,sub)}<section class="card"><h2>Responsabilidade do setor</h2><p>${desc}</p><div class="notice">Área demonstrativa da prévia. Os controles operacionais detalhados continuam vinculados à obra e às regras aprovadas.</div><p class="smalltext muted">Obras disponíveis: ${works.map(w=>esc(w.code)+' · '+esc(w.name)).join(' | ')}</p></section>`}
function render(){let pages={overview,works:worksPage,workdetail:workDetail,technical:()=>sectorIndex('technical'),purchases:()=>sectorIndex('purchases'),stock:()=>sectorIndex('stock'),installation:()=>sectorIndex('installation'),commercial:()=>genericPage('commercial'),pcp:()=>genericPage('pcp'),production:()=>genericPage('production'),closing:()=>genericPage('closing')};$('#app').innerHTML=(pages[current]||overview)();$('#crumb').textContent=({overview:'Visão geral',works:'Obras',workdetail:'Ficha da obra',technical:'Área técnica e projetos',purchases:'Compras',stock:'Estoque',installation:'Instalação',commercial:'Comercial',pcp:'PCP e agenda',production:'Produção',closing:'Conclusão'})[current]||'Visão geral';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===current||(current==='workdetail'&&false)));}
function sectorIndex(type){return `${head('Acompanhamento por obra',type==='technical'?'Área Técnica e Projetos':type==='purchases'?'Compras':type==='stock'?'Estoque':'Instalação','Escolha uma obra para abrir os controles específicos do setor.')}<section class="card"><div class="tablewrap"><table><thead><tr><th>Código / obra</th><th>Cliente</th><th>Tipo</th><th>Etapa / resumo</th><th></th></tr></thead><tbody>${works.map(w=>`<tr><td><b>${esc(w.code)}</b><div class="workname">${esc(w.name)}</div></td><td>${esc(w.client)}</td><td>${esc(w.type)}</td><td>${type==='technical'?'Medição: '+w.technical.measure+' · Plano: '+w.technical.cut:type==='purchases'?'Pedidos por material':type==='stock'?'Recebimentos por material':w.installed+'/'+w.items+' itens instalados'}</td><td><button class="btn small" onclick="openWork('${esc(w.code)}');workTab('${type==='technical'?'technical':type}')">Abrir</button></td></tr>`).join('')}</tbody></table></div></section>`}
function go(p){current=p;render()}function workTab(t){activeWorkTab=t;current='workdetail';render()}
function setTech(k,v){let w=work();w.technical[k]=v;save();toast('Etapa técnica atualizada.');render()}function setRelease(m,v){work().technical.materials[m].release=v;save();toast('Liberação para Compras atualizada.');render()}function setPurchase(m,v){let p=work().purchases[m];p.status=v;if(v==='Concluído'){let d=new Date().toISOString().slice(0,16);p.sent=d;p.history=p.history||[];p.history.push(d)}else{p.sent=''}save();toast('Controle de Compras atualizado.');render()}function resend(m){let p=work().purchases[m],d=new Date().toISOString().slice(0,16);p.status='Concluído';p.sent=d;p.history=p.history||[];p.history.push(d);save();toast('Reenvio registrado no histórico.');render()}function setStock(m,k,v){work().stock[m][k]=v;save();toast('Estoque atualizado.');render()}function setSchedule(c,field,v){let w=works.find(x=>x.code===c);if(!w)return;w[field]=v;save();toast('Período de programação atualizado.');render()}function setProduction(c,v){let w=works.find(x=>x.code===c);w.production=v;w.stage=v;save();toast('Acompanhamento atualizado.');render()}function saveProduction(){let w=work(),n=Math.max(0,Math.min(w.items,Number($('#mountedCount').value)||0));w.mounted=n;w.production=n>=w.items?'Concluído':n>0?'Parcialmente montada':'Pendente';w.productionObs=$('#productionObs').value;save();toast('Montagem atualizada.');render()}function saveInstall(){let w=work(),n=Math.max(0,Math.min(w.items,Number($('#installedCount').value)||0));w.installed=n;w.installers=$('#installers').value;w.obs=$('#installObs').value;w.installStatus=n===w.items?'Concluído':n>0?'Parcialmente instalado':'Pendente';w.stage=n===w.items?'Conclusão':'Instalação';save();toast('Instalação atualizada.');render()}
function openNewWork(){$('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Cadastrar obra</h2><div class="notice" style="margin-bottom:14px">O código e o nome são informados por você. Não há geração automática.</div><div class="fieldgrid"><div class="field"><label>Código da obra *</label><input id="newCode" placeholder="Ex.: 025"></div><div class="field"><label>Nome da obra *</label><input id="newName" placeholder="Nome definido por você"></div><div class="field"><label>Cliente</label><input id="newClient"></div><div class="field"><label>Telefone / contato</label><input id="newPhone"></div><div class="field" style="grid-column:1/-1"><label>Endereço da obra</label><input id="newAddress"></div><div class="field"><label>Tipo de empresa</label><select id="newType"><option>Esquadrias</option><option>Vidraçaria</option></select></div><div class="field"><label>Quantidade total de itens</label><input id="newItems" type="number" min="1" value="1"></div><div class="field" style="grid-column:1/-1"><label>Observações</label><textarea id="newObs"></textarea></div></div><div class="modalactions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="createWork()">Salvar obra</button></div></div></div>`}
function closeModal(){$('#modalroot').innerHTML=''}function createWork(){let code=$('#newCode').value.trim(),name=$('#newName').value.trim();if(!code||!name){toast('Informe o código e o nome da obra.');return}if(works.some(w=>w.code===code)){toast('Esse código já está cadastrado.');return}let m=()=>({release:'Pendente'}),p=()=>({status:'Pendente',sent:'',history:[]}),s=()=>({received:'Pendente',check:'Pendente'});let w={code,name,client:$('#newClient').value,address:$('#newAddress').value,phone:$('#newPhone').value,type:$('#newType').value,items:Math.max(1,Number($('#newItems').value)||1),mounted:0,installed:0,obs:$('#newObs').value,technical:{measure:'Pendente',cut:'Pendente',assembly:'Pendente',materials:{Vidros:m(),Acessórios:m(),Perfis:m()}},purchases:{Vidros:p(),Acessórios:p(),Perfis:p()},stock:{Vidros:s(),Acessórios:s(),Perfis:s()},production:'Pendente',productionStart:'',productionEnd:'',installationStart:'',installationEnd:'',installers:'',stage:'Cadastro'};works.push(w);selected=code;save();closeModal();toast('Obra cadastrada.');openWork(code)}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});render();
</script></body></html>
